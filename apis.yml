name: Clausematch
description: Clausematch is a London-founded regulatory technology (RegTech) company providing
  a cloud platform for policy and procedure management, regulatory change management, and
  structured document authoring and collaboration for banks, insurers, and other regulated
  financial institutions. Its tooling helps compliance teams draft, review, version, and
  attest to policies while mapping regulatory obligations to internal controls. Clausematch
  was acquired by Corlytics in 2024; the clausematch.com domain now 301-redirects to
  corlytics.com. This profile was surfaced as a portfolio company of Speedinvest and added
  to the API Evangelist network for enrichment. No public developer portal, API reference,
  or machine-readable API specification was found during enrichment (the web surface is
  WAF-protected and returns HTTP 403 to automated probes).
